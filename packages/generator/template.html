<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mes prévisions annuelles 2027</title>
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10pt; line-height: 1.2; color: #1a1a1a; background: #fdfbf7; }
  .page { width: 210mm; height: 297mm; padding: 16mm 18mm 20mm; position: relative; overflow: hidden; page-break-after: always; }
  .page:last-child { page-break-after: auto; }
  h1 { font-size: 24pt; color: #312e81; margin: 0 0 4mm; }
  h2 { font-size: 13pt; color: #312e81; border-bottom: 1.5px solid #312e81; padding-bottom: 1.5mm; margin: 0 0 3mm; }
  h3 { font-size: 10.5pt; color: #3730a3; margin: 3mm 0 1mm; }
  p { margin: 0 0 1.6mm; text-align: justify; }
  .ligne { margin: 0 0 0.6mm; }
  .cover { background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); color: #fff; text-align: center; }
  .cover h1 { color: #fff; font-size: 30pt; letter-spacing: 2px; margin-top: 55mm; }
  .cover h2 { color: #cbd5e1; border: none; font-weight: 300; font-size: 15pt; }
  .cover .meta { margin-top: 30mm; font-size: 11pt; border-top: 1px solid rgba(255,255,255,.25); padding-top: 6mm; }
  .domaine { margin-bottom: 2mm; }
  .ciel { font-style: italic; color: #374151; }
  .conseil { background: #fffbeb; border-left: 3px solid #d97706; padding: 1.5mm 3mm; margin-bottom: 1.5mm; }
  .conseil small { display: block; font-weight: bold; color: #92400e; text-transform: uppercase; font-size: 8pt; }
  .pied { position: absolute; left: 18mm; right: 18mm; bottom: 7mm; font-size: 8pt; color: #64748b; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 1.5mm; }
  table { width: 100%; border-collapse: collapse; font-size: 10pt; }
  td, th { padding: 1.2mm 2mm; border-bottom: 1px solid #e2e8f0; text-align: left; }
</style>
</head>
